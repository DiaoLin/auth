<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plants vs. Zombies GOTY Edition - 植物大战僵尸年度版</title>
  <script src="jszip.min.js"></script>
  <style>
    * { box-sizing: border-box }
    html, body { width: 100%; min-height: 100%; margin: 0 }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      color: #eee;
      background: #1a1a2e;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #start-screen {
      width: min(440px, 100%);
      text-align: center;
    }
    h1 { margin: 0 0 28px; color: #4ecca3; font-size: clamp(1.5rem, 6vw, 2rem) }
    h1 span { display: block; margin-top: 8px; color: #eee; font-size: .82em }
    #resource-url {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #4ecca3;
      border-radius: 8px;
      color: #eee;
      background: #222238;
      font-size: 1rem;
    }
    #start-button, dialog button {
      border: 1px solid #4ecca3;
      border-radius: 8px;
      padding: 12px 20px;
      color: #10251f;
      background: #4ecca3;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    #start-button { width: 100%; margin-top: 14px }
    button:disabled { opacity: .55; cursor: wait }
    #loading-status { min-height: 1.5em; margin: 18px 0 8px; color: #ddd }
    progress { width: 100%; height: 12px; accent-color: #4ecca3 }
    #canvas-container {
      display: none;
      position: fixed;
      inset: 0;
      flex-direction: column;
      overflow: hidden;
      background: #000;
    }
    #game-toolbar {
      flex: 0 0 auto;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-bottom: 1px solid #353553;
      background: rgba(20, 20, 38, .94);
      z-index: 6;
    }
    #game-toolbar button {
      padding: 6px 10px;
      border: 1px solid #4ecca3;
      border-radius: 6px;
      color: #4ecca3;
      background: #2b2b40;
      font-size: .88rem;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
    }
    #game-toolbar button:hover { background: #253b36 }
    #game-toolbar button.active { color: #10251f; background: #4ecca3 }
    #game-toolbar .toolbar-value {
      min-width: 58px;
      color: #eee;
      font-size: .88rem;
      font-variant-numeric: tabular-nums;
      text-align: center;
    }
    #game-toolbar .toolbar-spacer { flex: 1 1 auto }
    #game-stage {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #game-stage:fullscreen {
      width: 100vw;
      height: 100vh;
      background: #000;
    }
    canvas { display: block; max-width: none; background: #000; outline: 0 }
    #game-loading {
      position: absolute;
      inset: 0;
      z-index: 8;
      display: grid;
      align-content: center;
      justify-items: center;
      gap: 12px;
      padding: 24px;
      background: #000;
    }
    #game-loading[hidden] { display: none }
    #game-loading p { margin: 0; color: #eee }
    #game-loading progress { width: min(360px, 90%) }
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgb(0 0 0 / 75%);
    }
    .modal-overlay[hidden] { display: none }
    .modal-panel {
      width: min(460px, calc(100vw - 32px));
      max-height: 80vh;
      overflow: auto;
      padding: 22px;
      border: 1px solid #4ecca3;
      border-radius: 12px;
      color: #eee;
      background: #1a1a2e;
    }
    .modal-panel h2 { margin: 0 0 12px; color: #4ecca3; font-size: 1.25rem }
    .modal-panel p { white-space: pre-line; overflow-wrap: anywhere }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px }
    .modal-actions button {
      border: 1px solid #4ecca3;
      border-radius: 8px;
      padding: 9px 14px;
      color: #4ecca3;
      background: #2b2b40;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
    }
    .modal-actions button.primary { color: #10251f; background: #4ecca3 }
    #app-modal-input {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px solid #4ecca3;
      border-radius: 6px;
      color: #eee;
      background: #222238;
      font: inherit;
    }
    #app-modal-input[hidden] { display: none }
    #editor-overlay {
      position: fixed;
      inset: 0;
      z-index: 15;
      display: grid;
      place-items: center;
      padding: 16px;
      background: rgb(0 0 0 / 78%);
    }
    #editor-overlay[hidden] { display: none }
    #editor-overlay .editor-dialog {
      display: flex;
      flex-direction: column;
      width: min(1100px, 96vw);
      height: min(760px, 92vh);
      padding: 0;
      overflow: hidden;
    }
    #editor-overlay .editor-dialog header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 16px;
      border-bottom: 1px solid #4ecca3;
    }
    #editor-overlay .editor-dialog header h2 { margin: 0; font-size: 1.05rem }
    #editor-overlay .editor-dialog header #editor-close {
      width: 34px;
      height: 34px;
      padding: 0;
      display: grid;
      place-items: center;
      border: 1px solid #4ecca3;
      border-radius: 50%;
      color: #4ecca3;
      background: transparent;
      font-size: 1.5rem;
      line-height: 1;
      transition: background .15s, color .15s;
    }
    #editor-overlay .editor-dialog header #editor-close:hover {
      color: #10251f;
      background: #4ecca3;
    }
    #editor-overlay iframe { flex: 1; width: 100%; border: 0; background: #141426 }
    #cloud-save-dialog {
      width: min(460px, calc(100vw - 32px));
      max-height: 80vh;
      overflow: auto;
      padding: 22px;
      border: 1px solid #4ecca3;
      border-radius: 12px;
      color: #eee;
      background: #1a1a2e;
    }
    #cloud-save-dialog h2 { margin: 0 0 12px; color: #4ecca3; font-size: 1.25rem }
    #cloud-save-status { min-height: 1.4em; color: #ff8b8b }
    .cloud-save-slot {
      padding: 12px;
      margin: 12px 0;
      border: 1px solid #44445a;
      border-radius: 8px;
    }
    .cloud-save-slot strong,
    .cloud-save-slot small { display: block; overflow-wrap: anywhere }
    .cloud-save-slot small { margin-top: 5px; color: #aaa }
    .cloud-save-slot-actions,
    #cloud-save-dialog-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px }
    #cloud-save-dialog button {
      padding: 8px 12px;
      color: #4ecca3;
      background: #2b2b40;
      border: 1px solid #4ecca3;
      border-radius: 6px;
      cursor: pointer;
    }
    #cloud-save-dialog button:disabled { opacity: .55; cursor: wait }
    #cloud-save-login a { color: #4ecca3 }
    #start-cloud-save-button,
    #start-save-editor-link,
    #cloud-save-editor-link {
      display: inline-block;
      padding: 8px 12px;
      border: 1px solid #4ecca3;
      border-radius: 6px;
      color: #4ecca3;
      background: #2b2b40;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
    }
    #start-button, #start-cloud-save-button, #start-save-editor-link {
      min-height: 46px;
      box-sizing: border-box;
      line-height: 1.2;
    }
    #start-cloud-save-button, #start-save-editor-link {
      margin-top: 12px;
      padding: 12px 20px;
      font-size: 1rem;
      line-height: 1.2;
    }
    #save-sync-status {
      max-width: min(34vw, 320px);
      overflow: hidden;
      color: #eee;
      font-size: .85rem;
      text-overflow: ellipsis;
      white-space: nowrap;
      pointer-events: none;
    }
    @media (max-width: 420px) {
      body { padding: 18px }
    }
  </style>
</head>
<body>
  <main id="start-screen">
    <h1>Plants vs. Zombies GOTY Edition<span>植物大战僵尸年度版</span></h1>
    <input id="resource-url" type="url" value="/pvz-res.zip" aria-label="资源下载地址" autocomplete="url">
    <button id="start-button" type="button">开始游戏</button>
    <button id="start-cloud-save-button" type="button">☁️ 云存档</button>
    <a id="start-save-editor-link" href="save-editor.html" target="_blank" rel="noopener">🛠 存档编辑器</a>
    <p id="loading-status" role="status" aria-live="polite"></p>
    <progress id="download-progress" max="100" value="0" hidden aria-label="资源下载进度"></progress>
  </main>

  <main id="canvas-container">
    <div id="game-toolbar">
      <button id="zoom-out" type="button" title="缩小">−</button>
      <span id="zoom-value" class="toolbar-value" aria-live="polite">自适应</span>
      <button id="zoom-in" type="button" title="放大">＋</button>
      <button id="zoom-fit" type="button" class="active" title="自适应窗口大小">自适应</button>
      <button id="zoom-fullscreen" type="button" title="网页内全屏">⛶ 全屏</button>
      <button id="game-cloud-save-button" type="button">☁️ 云存档</button>
      <button id="game-editor-button" type="button">🛠 存档编辑器</button>
      <button id="exit-game-button" type="button" title="退出游戏并返回开始页">退出</button>
      <span class="toolbar-spacer"></span>
      <span id="save-sync-status" role="status" aria-live="polite"></span>
    </div>
    <div id="game-stage">
      <canvas id="canvas" width="800" height="600" tabindex="0"></canvas>
    </div>
    <div id="game-loading" role="status" aria-live="polite">
      <p id="game-loading-status">正在启动游戏…</p>
      <progress id="game-progress" max="100" value="0"></progress>
    </div>
  </main>

  <div id="editor-overlay" hidden>
    <section class="modal-panel editor-dialog" role="dialog" aria-modal="true" aria-labelledby="editor-overlay-title">
      <header>
        <h2 id="editor-overlay-title">🛠 存档编辑器</h2>
        <button id="editor-close" type="button" title="关闭编辑器" aria-label="关闭编辑器">×</button>
      </header>
      <iframe id="editor-frame" title="存档编辑器"></iframe>
    </section>
  </div>

  <div id="cloud-save-overlay" class="modal-overlay" hidden>
    <section id="cloud-save-dialog" role="dialog" aria-modal="true" aria-labelledby="cloud-save-title" tabindex="-1">
      <h2 id="cloud-save-title">云存档</h2>
      <p>每台设备最多保存两个槽位，每个存档不超过 10 MiB。</p>
      <p id="cloud-save-status" role="status" aria-live="polite"></p>
      <p id="cloud-save-login" hidden><a href="/check.html">先登录设备</a>后即可使用云存档。</p>
      <div id="cloud-save-list"></div>
      <div id="cloud-save-dialog-actions">
        <button id="cloud-save-refresh" type="button">刷新</button>
        <button id="cloud-save-close" type="button">关闭</button>
      </div>
      <p style="color:#aaa">要直接修改本机存档，请关闭游戏页面后使用 <a id="cloud-save-editor-link" href="save-editor.html" target="_blank" rel="noopener">存档编辑器</a>。</p>
    </section>
  </div>
  <div id="app-modal-overlay" class="modal-overlay" hidden>
    <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="app-modal-title" aria-describedby="app-modal-message" tabindex="-1">
      <h2 id="app-modal-title">确认操作</h2>
      <p id="app-modal-message"></p>
      <input id="app-modal-input" type="text" maxlength="40" hidden>
      <div class="modal-actions">
        <button id="app-modal-cancel" type="button">取消</button>
        <button id="app-modal-confirm" class="primary" type="button">继续</button>
      </div>
    </section>
  </div>

  <textarea id="pvz-soft-keyboard" autocapitalize="off" autocomplete="off" autocorrect="off" enterkeyhint="done" spellcheck="false" style="position:fixed;top:0;left:0;width:1px;height:1px;padding:0;border:0;opacity:0;resize:none;pointer-events:none;font-size:16px"></textarea>

  <script>
    window.moduleReadyPromise = new Promise((resolve, reject) => {
      window._resolveModuleReady = resolve;
      window._rejectModuleReady = reject;
    });
    var Module = {
      canvas: document.getElementById("canvas"),
      noInitialRun: true,
      onRuntimeInitialized: () => window._resolveModuleReady(),
      onAbort: (message) => window._rejectModuleReady(new Error(message)),
      print: (message) => console.log(message),
      printErr: (message) => console.warn(message)
    };
    Module.canvas.addEventListener("contextmenu", (event) => event.preventDefault());
  </script>
  <script src="pvz-portable.js" async></script>
  <script>
    "use strict";
    const startScreen = document.getElementById("start-screen");
    const startButton = document.getElementById("start-button");
    const resourceUrl = document.getElementById("resource-url");
    const loadingStatus = document.getElementById("loading-status");
    const downloadProgress = document.getElementById("download-progress");
    const canvasContainer = document.getElementById("canvas-container");
    const gameLoading = document.getElementById("game-loading");
    const gameLoadingStatus = document.getElementById("game-loading-status");
    const gameProgress = document.getElementById("game-progress");
    const cloudSaveDialog = document.getElementById("cloud-save-dialog");
    const cloudSaveOverlay = document.getElementById("cloud-save-overlay");
    const cloudSaveList = document.getElementById("cloud-save-list");
    const cloudSaveStatus = document.getElementById("cloud-save-status");
    const cloudSaveLogin = document.getElementById("cloud-save-login");
    const appModalOverlay = document.getElementById("app-modal-overlay");
    const appModalTitle = document.getElementById("app-modal-title");
    const appModalMessage = document.getElementById("app-modal-message");
    const appModalInput = document.getElementById("app-modal-input");
    const appModalCancel = document.getElementById("app-modal-cancel");
    const appModalConfirm = document.getElementById("app-modal-confirm");
    const saveSyncStatus = document.getElementById("save-sync-status");
    const editorOverlay = document.getElementById("editor-overlay");
    const editorFrame = document.getElementById("editor-frame");
    let canvasEl = document.getElementById("canvas");
    let gameStage = document.getElementById("game-stage");
    const zoomValue = document.getElementById("zoom-value");
    const zoomFitButton = document.getElementById("zoom-fit");
    const NATIVE_CANVAS_WIDTH = 800;
    const NATIVE_CANVAS_HEIGHT = 600;
    const resourceFiles = new Map();
    let viewMode = "fit";
    let viewScale = 1;
    let resizeFrame = 0;
    let resourcesInstalled = false;
    let gameRunning = false;
    let needsRuntimeReload = false;
    let saveFsReadyPromise = null;
    let listenerGeneration = 0;
    const runtimeListeners = [];
    const runtimeAudioContexts = [];

    function trackEventTarget(target) {
      if (!target || target.__pvzSaveTracked) return;
      target.__pvzSaveTracked = true;
      const originalAdd = target.addEventListener;
      const originalRemove = target.removeEventListener;
      target.addEventListener = function (type, listener, options) {
        runtimeListeners.push({ target, type, listener, options, gen: listenerGeneration });
        return originalAdd.call(this, type, listener, options);
      };
      target.removeEventListener = function (type, listener, options) {
        const index = runtimeListeners.findIndex((item) =>
          item.target === target && item.type === type && item.listener === listener);
        if (index >= 0) runtimeListeners.splice(index, 1);
        return originalRemove.call(this, type, listener, options);
      };
    }

    function trackRuntimeSideEffects() {
      trackEventTarget(window);
      trackEventTarget(document);
      trackEventTarget(canvasEl);
      const NativeAudioContext = window.AudioContext || window.webkitAudioContext;
      if (NativeAudioContext && !NativeAudioContext.__pvzSaveTracked) {
        function TrackedAudioContext(...args) {
          const context = new NativeAudioContext(...args);
          runtimeAudioContexts.push({ context, gen: listenerGeneration });
          return context;
        }
        TrackedAudioContext.prototype = NativeAudioContext.prototype;
        TrackedAudioContext.__pvzSaveTracked = true;
        window.AudioContext = window.webkitAudioContext = TrackedAudioContext;
      }
    }

    function disposePreviousRuntime() {
      for (const item of runtimeListeners) {
        if (item.gen <= 0) continue;
        try { item.target.removeEventListener(item.type, item.listener, item.options); } catch (_) {}
      }
      for (let i = runtimeListeners.length - 1; i >= 0; i--) {
        if (runtimeListeners[i].gen > 0) runtimeListeners.splice(i, 1);
      }
      for (const item of runtimeAudioContexts) {
        if (item.gen <= 0) continue;
        try { item.context.close(); } catch (_) {}
      }
      for (let i = runtimeAudioContexts.length - 1; i >= 0; i--) {
        if (runtimeAudioContexts[i].gen > 0) runtimeAudioContexts.splice(i, 1);
      }
    }
    let saveBackend = "";
    let saveSyncInFlight = null;
    let saveSyncQueued = false;
    let saveSyncIntervalId = 0;
    let appModalResolve = null;
    let appModalHasInput = false;
    let saveDatabasePromise = null;

    function showAppModal(message, options = {}) {
      appModalTitle.textContent = options.title || "确认操作";
      appModalMessage.textContent = message;
      appModalHasInput = Object.prototype.hasOwnProperty.call(options, "inputValue");
      appModalInput.hidden = !appModalHasInput;
      appModalInput.value = appModalHasInput ? options.inputValue : "";
      appModalCancel.hidden = !options.confirm && !appModalHasInput;
      appModalConfirm.textContent = options.confirm ? "继续" : "确定";
      appModalOverlay.hidden = false;
      (appModalHasInput ? appModalInput : appModalConfirm).focus();
      return new Promise((resolve) => {
        appModalResolve = resolve;
      });
    }

    function finishAppModal(result) {
      if (!appModalResolve) return;
      const resolve = appModalResolve;
      appModalResolve = null;
      appModalOverlay.hidden = true;
      resolve(result
        ? appModalHasInput ? appModalInput.value : true
        : appModalHasInput ? null : false);
    }

    function showConfirmModal(message) {
      return showAppModal(message, { confirm: true });
    }

    function askForText(message, inputValue) {
      return showAppModal(message, { inputValue });
    }

    function setProgress(value, max) {
      for (const progress of [downloadProgress, gameProgress]) {
        progress.hidden = false;
        if (max > 0) {
          progress.max = max;
          progress.value = value;
        } else {
          progress.removeAttribute("max");
          progress.removeAttribute("value");
        }
      }
    }

    function normalizeResourcePath(path) {
      const parts = path.replace(/\\/g, "/").replace(/^\/+/, "").split("/").filter(Boolean);
      if (!parts.length) return "";
      const resourceIndex = parts.findIndex((part, index) =>
        index <= 2 && (part === "main.pak" || part === "properties")
      );
      return resourceIndex >= 0 ? parts.slice(resourceIndex).join("/") :
        parts.length > 1 ? parts.slice(1).join("/") : parts[0];
    }

    function resolveResourceUrl(value) {
      const input = value.trim();
      if (!input) throw new Error("请输入资源下载地址。");
      if (/^https?:\/\//i.test(input) || /^\/\//.test(input)) {
        return new URL(input.startsWith("//") ? location.protocol + input : input).href;
      }
      if (location.protocol === "file:") {
        throw new Error("请通过网页访问本页面后再下载资源。");
      }
      return new URL(input, document.baseURI).href;
    }

    async function downloadResources() {
      const url = resolveResourceUrl(resourceUrl.value);
      loadingStatus.textContent = "正在下载游戏资源…";
      downloadProgress.hidden = false;
      downloadProgress.removeAttribute("max");
      downloadProgress.removeAttribute("value");
      const response = await fetch(url, { credentials: "same-origin" });
      if (!response.ok) throw new Error("资源下载失败（HTTP " + response.status + "）。");

      const total = Number(response.headers.get("content-length")) || 0;
      const chunks = [];
      let received = 0;
      if (response.body && response.body.getReader) {
        const reader = response.body.getReader();
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          received += value.byteLength;
          if (total > 0) {
            setProgress(received, total);
            loadingStatus.textContent = "正在下载游戏资源… " +
              Math.min(100, Math.floor(received / total * 100)) + "%";
          } else {
            setProgress(0, 0);
            loadingStatus.textContent = "正在下载游戏资源… " + formatSize(received);
          }
        }
      } else {
        const buffer = await response.arrayBuffer();
        chunks.push(new Uint8Array(buffer));
        received = buffer.byteLength;
        if (total > 0) setProgress(received, total);
      }
      setProgress(Math.max(received, 1), Math.max(total, received, 1));
      loadingStatus.textContent = "正在解压并导入资源…";
      const zip = await JSZip.loadAsync(new Blob(chunks, { type: "application/zip" }));
      resourceFiles.clear();
      for (const [path, entry] of Object.entries(zip.files)) {
        if (entry.dir) continue;
        const normalizedPath = normalizeResourcePath(path);
        if (normalizedPath) resourceFiles.set(normalizedPath, await entry.async("uint8array"));
      }
      if (!resourceFiles.has("main.pak") ||
          !Array.from(resourceFiles.keys()).some((path) => path.startsWith("properties/"))) {
        throw new Error("资源包不完整，未找到 main.pak 或 properties 文件夹。");
      }
      loadingStatus.textContent = "资源导入完成。";
    }

    function formatSize(bytes) {
      return bytes >= 1048576 ? (bytes / 1048576).toFixed(1) + " MiB" :
        bytes >= 1024 ? (bytes / 1024).toFixed(1) + " KiB" : bytes + " B";
    }

    function ensureGameStage() {
      let stage = document.getElementById("game-stage");
      if (!stage || !stage.contains(canvasEl)) {
        stage = document.createElement("div");
        stage.id = "game-stage";
        canvasEl.parentNode.insertBefore(stage, canvasEl);
        stage.appendChild(canvasEl);
      }
      gameStage = stage;
      return stage;
    }

    function applyCanvasScale() {
      if (resizeFrame) cancelAnimationFrame(resizeFrame);
      resizeFrame = requestAnimationFrame(() => {
        resizeFrame = 0;
        const stage = ensureGameStage();
        let scale = viewScale;
        if (viewMode === "fit") {
          const availableWidth = Math.max(1, stage.clientWidth - 16);
          const availableHeight = Math.max(1, stage.clientHeight - 16);
          scale = Math.min(availableWidth / NATIVE_CANVAS_WIDTH, availableHeight / NATIVE_CANVAS_HEIGHT);
        }
        scale = Math.max(0.2, Math.min(scale, 4));
        canvasEl.style.width = Math.round(NATIVE_CANVAS_WIDTH * scale) + "px";
        canvasEl.style.height = Math.round(NATIVE_CANVAS_HEIGHT * scale) + "px";
        zoomValue.textContent = viewMode === "fit" ? "自适应" : Math.round(scale * 100) + "%";
        zoomFitButton.classList.toggle("active", viewMode === "fit");
      });
    }

    function setZoom(scale) {
      viewMode = "manual";

    async function cloudSaveApi(path, options = {}) {
      let token;
      try {
        token = localStorage.getItem("device_token");
      } catch {
        throw new Error("无法读取设备登录信息。");
      }
      if (!token) return null;
      const headers = new Headers(options.headers || {});
      headers.set("Authorization", "Bearer " + token);
      const response = await fetch("/api/cloud-saves" + path, {
        ...options,
        cache: "no-store",
        headers
      });
      if (response.status === 401) return null;
      if (!response.ok) {
        let message = "云存档请求失败（HTTP " + response.status + "）。";
        try {
          const data = await response.json();
          if (data.error) message = data.error;
        } catch {
          // Keep the HTTP error when the response is not JSON.
        }
        throw new Error(message);
      }
      return response;
    }

    function openSaveDatabase() {
      if (!saveDatabasePromise) {
        saveDatabasePromise = new Promise((resolve, reject) => {
          if (!window.indexedDB) {
            reject(new Error("此浏览器不支持 IndexedDB，无法保存本机进度。"));
            return;
          }
          const request = window.indexedDB.open("pvz-browser-saves", 1);
          request.onupgradeneeded = () => {
            if (!request.result.objectStoreNames.contains("saves")) {
              request.result.createObjectStore("saves");
            }
          };
          request.onsuccess = () => resolve(request.result);
          request.onerror = () => reject(request.error || new Error("无法打开本机存档数据库。"));
          request.onblocked = () => reject(new Error("本机存档数据库升级被其他页面阻止，请关闭其他游戏页面后重试。"));
        });
      }
      return saveDatabasePromise;
    }

    async function saveDatabaseRequest(mode, operation, value) {
      const database = await openSaveDatabase();
      return new Promise((resolve, reject) => {
        const transaction = database.transaction("saves", mode);
        const store = transaction.objectStore("saves");
        const request = operation === "get" ? store.get("userdata") :
          operation === "delete" ? store.delete("userdata") :
            store.put(value, "userdata");
        let result;
        request.onsuccess = () => { result = request.result; };
        request.onerror = () => reject(request.error || new Error("本机存档数据库操作失败。"));
        transaction.oncomplete = () => resolve(result);
        transaction.onerror = () => reject(transaction.error || new Error("本机存档数据库事务失败。"));
        transaction.onabort = () => reject(transaction.error || new Error("本机存档数据库事务已中止。"));
      });
    }

    async function ensureSaveFsReady() {
      if (!saveFsReadyPromise) {
        saveFsReadyPromise = (async () => {
          await window.moduleReadyPromise;
          if (!Module.FS.analyzePath("/saves").exists) Module.FS.mkdir("/saves");
          if (Module.FS.filesystems && Module.FS.filesystems.IDBFS) {
            Module.FS.mount(Module.FS.filesystems.IDBFS, {}, "/saves");
            await new Promise((resolve, reject) => Module.FS.syncfs(true, (error) =>
              error ? reject(error) : resolve()
            ));
            saveBackend = "idbfs";
          } else {
            saveBackend = "indexeddb";
            const snapshot = await saveDatabaseRequest("readonly", "get");
            if (!snapshot || !snapshot.byteLength) return;
            const zip = await JSZip.loadAsync(snapshot);
            const entries = Object.entries(zip.files).filter(([, entry]) => !entry.dir);
            if (entries.length > 1000) throw new Error("本机存档文件数量无效。");
            for (const [entryPath, entry] of entries) {
              const path = entryPath.replace(/\\/g, "/").replace(/^\/+/, "");
              const parts = path.split("/");
              if (!path || parts.some((part) => !part || part === "." || part === "..")) {
                throw new Error("本机存档包含无效文件路径。");
              }
              const contents = await entry.async("uint8array");
              if (!Module.FS.analyzePath("/saves/userdata").exists) {
                Module.FS.mkdir("/saves/userdata");
              }
              const target = "/saves/" + parts.join("/");
              Module.FS.mkdirTree(target.slice(0, target.lastIndexOf("/")));
              Module.FS.writeFile(target, contents);
            }
          }
        })();
      }
      return saveFsReadyPromise;
    }

    function collectSaveFiles(directory) {
      if (!Module.FS.analyzePath(directory).exists) return [];
      const entries = Module.FS.readdir(directory);
      const files = [];
      for (const entry of entries) {
        if (entry === "." || entry === "..") continue;
        const path = directory + "/" + entry;
        const stat = Module.FS.stat(path);
        if (Module.FS.isDir(stat.mode)) files.push(...collectSaveFiles(path));
        else files.push(path);
      }
      return files;
    }

    async function syncSaves() {
      await ensureSaveFsReady();
      if (saveSyncInFlight) {
        saveSyncQueued = true;
        return saveSyncInFlight;
      }
      saveSyncInFlight = (async () => {
        do {
          saveSyncQueued = false;
          if (saveBackend === "idbfs") {
            await new Promise((resolve, reject) => Module.FS.syncfs(false, (error) =>
              error ? reject(error) : resolve()
            ));
            continue;
          }
          const files = collectSaveFiles("/saves/userdata");
          if (!files.length) {
            await saveDatabaseRequest("readwrite", "delete");
            continue;
          }
          const zip = new JSZip();
          for (const file of files) {
            zip.file(file.replace(/^\/saves\//, ""), Module.FS.readFile(file));
          }
          const snapshot = await zip.generateAsync({
            type: "uint8array",
            compression: "DEFLATE",
            compressionOptions: { level: 6 }
          });
          await saveDatabaseRequest("readwrite", "put", snapshot);
        } while (saveSyncQueued);
      })();
      try {
        await saveSyncInFlight;
      } finally {
        saveSyncInFlight = null;
      }
    }

    function startSaveAutosync() {
      if (saveSyncIntervalId) return;
      saveSyncIntervalId = window.setInterval(() => {
        syncSaves().then(() => {
          saveSyncStatus.textContent = "";
        }).catch((error) => {
          console.error("本机存档同步失败：", error);
          saveSyncStatus.textContent = "本机存档同步失败，请打开云存档面板检查。";
        });
      }, 5000);
    }

    function stopSaveAutosync() {
      if (saveSyncIntervalId) {
        clearInterval(saveSyncIntervalId);
        saveSyncIntervalId = 0;
      }
    }

    function stopGameRuntime() {
      gameRunning = false;
      needsRuntimeReload = true;

        try { window.MainLoop.pause(); } catch (error) { console.warn("暂停主循环失败：", error); }
      }

    function syncSavesBeforeLeaving() {

      }
    }

    window.addEventListener("message", async (event) => {
      if (event.origin !== window.location.origin) return;
      const data = event.data;
      if (!data || typeof data !== "object") return;
      if (data.type === "pvz-editor-confirm") {
        const ok = await showAppModal(data.message, { title: data.title || "确认操作", confirm: true });
        if (editorFrame.contentWindow) {
          editorFrame.contentWindow.postMessage(
            { type: "pvz-editor-confirm-result", id: data.id, ok },
            window.location.origin
          );
        }
      } else if (data.type === "pvz-editor-close") {
        closeEditorOverlay();
      } else if (data.type === "pvz-editor-saved") {
        const confirmed = await showAppModal(
          "存档已写入本机，将重启游戏以载入修改。当前未保存的游戏进度可能丢失。是否继续？",

    function setCloudSaveStatus(message, isError = false) {
      cloudSaveStatus.textContent = message;
      cloudSaveStatus.style.color = isError ? "#ff8b8b" : "#aaa";
    }

    async function importCloudSave(save) {
      const response = await cloudSaveApi("/" + save.slot);
      if (!response) throw new Error("登录设备后才能使用云存档。");
      const zip = await JSZip.loadAsync(await response.blob());
      const entries = Object.entries(zip.files).filter(([, entry]) => !entry.dir);
      if (!entries.length || entries.length > 1000) throw new Error("云存档文件数量无效。");
      const files = [];
      let totalSize = 0;
      for (const [entryPath, entry] of entries) {
        let path = entryPath.replace(/\\/g, "/").replace(/^\/+/, "");
        if (path.startsWith("userdata/")) path = path.slice(9);
        const parts = path.split("/");
        if (!path || parts.some((part) => !part || part === "." || part === "..")) {
          throw new Error("云存档包含无效文件路径。");
        }
        const contents = await entry.async("uint8array");
        totalSize += contents.byteLength;
        if (totalSize > 50 * 1024 * 1024) throw new Error("云存档解压后超过 50 MiB。");
        files.push({ path: parts.join("/"), contents });
      }

      await ensureSaveFsReady();
      const currentFiles = collectSaveFiles("/saves/userdata");
      for (const path of currentFiles) Module.FS.unlink(path);
      function removeDirectories(directory) {
        if (!Module.FS.analyzePath(directory).exists) return;
        const entries = Module.FS.readdir(directory);
        for (const entry of entries) {
          if (entry === "." || entry === "..") continue;
          const path = directory + "/" + entry;
          if (Module.FS.isDir(Module.FS.stat(path).mode)) {
            removeDirectories(path);
            Module.FS.rmdir(path);
          }
        }
      }
      removeDirectories("/saves/userdata");
      if (!Module.FS.analyzePath("/saves/userdata").exists) Module.FS.mkdir("/saves/userdata");
      for (const file of files) {
        const path = "/saves/userdata/" + file.path;
        Module.FS.mkdirTree(path.slice(0, path.lastIndexOf("/")));
        Module.FS.writeFile(path, file.contents);
      }
      await syncSaves();
      return true;
    }

    async function uploadCloudSave(save) {
      const defaultName = save.name || "PVZ 存档 " + new Date().toLocaleDateString("zh-CN");
      const name = await askForText("请输入云存档名称（最多 40 个字符）：", defaultName);
      if (name === null) return;
      if (!name.trim()) {
        setCloudSaveStatus("存档名称不能为空。", true);
        return;
      }
      if (save.name && !await showConfirmModal("确定覆盖云存档“" + save.name + "”吗？")) return;
      try {
        setCloudSaveStatus("正在准备本机存档…");
        await ensureSaveFsReady();
        await syncSaves();
        const files = collectSaveFiles("/saves/userdata");
        if (!files.length) throw new Error("未找到本机游戏存档。");
        const zip = new JSZip();
        for (const file of files) {
          zip.file(file.replace(/^\/saves\//, ""), Module.FS.readFile(file));
        }
        const data = await zip.generateAsync({
          type: "uint8array",
          compression: "DEFLATE",
          compressionOptions: { level: 6 }
        });
        const response = await cloudSaveApi(
          "/" + save.slot + "?name=" + encodeURIComponent(name.trim()),
          { method: "PUT", headers: { "Content-Type": "application/octet-stream" }, body: data }
        );
        if (!response) throw new Error("登录设备后才能使用云存档。");
        await refreshCloudSaveList();
        setCloudSaveStatus("云存档已上传。");
      } catch (error) {
        setCloudSaveStatus(error.message || "云存档上传失败。", true);
      }
    }

    async function renameCloudSave(save) {
      const name = await askForText("请输入新名称（最多 40 个字符）：", save.name);
      if (name === null) return;
      if (!name.trim()) {
        setCloudSaveStatus("存档名称不能为空。", true);
        return;
      }
      try {
        const response = await cloudSaveApi("/" + save.slot, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ name: name.trim() })
        });
        if (!response) throw new Error("登录设备后才能使用云存档。");
        await refreshCloudSaveList();
      } catch (error) {
        setCloudSaveStatus(error.message || "云存档重命名失败。", true);
      }
    }

    async function deleteCloudSave(save) {
      if (!await showConfirmModal("确定删除云存档“" + save.name + "”吗？")) return;
      try {
        const response = await cloudSaveApi("/" + save.slot, { method: "DELETE" });
        if (!response) throw new Error("登录设备后才能使用云存档。");
        await refreshCloudSaveList();
      } catch (error) {
        setCloudSaveStatus(error.message || "云存档删除失败。", true);
      }
    }

    async function refreshCloudSaveList() {
      cloudSaveList.replaceChildren();
      cloudSaveLogin.hidden = true;
      setCloudSaveStatus("正在读取云存档…");
      try {
        const response = await cloudSaveApi("");
        if (!response) {
          cloudSaveLogin.hidden = false;
          setCloudSaveStatus("请先登录设备。", true);
          return;
        }
        const data = await response.json();
        setCloudSaveStatus("");
        for (const save of data.slots || []) {
          const card = document.createElement("section");
          const title = document.createElement("strong");
          const details = document.createElement("small");
          const actions = document.createElement("div");
          const uploadButton = document.createElement("button");
          card.className = "cloud-save-slot";
          title.textContent = "槽位 " + save.slot + (save.name ? " — " + save.name : " — 空");
          details.textContent = save.updated_at
            ? "更新时间：" + new Date(save.updated_at).toLocaleString("zh-CN") +
              " · " + formatSize(save.size_bytes)
            : "尚无云存档";
          actions.className = "cloud-save-slot-actions";
          uploadButton.type = "button";
          uploadButton.textContent = save.name ? "覆盖并上传本机存档" : "上传本机存档";
          uploadButton.addEventListener("click", () => uploadCloudSave(save));
          actions.appendChild(uploadButton);
          if (save.name) {
            const importButton = document.createElement("button");
            const renameButton = document.createElement("button");
            const deleteButton = document.createElement("button");
            importButton.type = renameButton.type = deleteButton.type = "button";
            importButton.textContent = "导入到本机";
            renameButton.textContent = "重命名";
            deleteButton.textContent = "删除";
            importButton.addEventListener("click", async () => {
              const confirmed = await showAppModal(
                "导入云存档会替换当前本机存档，并立即重启游戏。当前未保存的进度可能丢失。是否继续？",
                { title: "导入云存档", confirm: true }
              );
              if (!confirmed) {
                setCloudSaveStatus("");
                return;
              }
              try {
                setCloudSaveStatus("正在导入云存档…");
                const imported = await importCloudSave(save);
                if (!imported) return;
                if (gameRunning) {
                  setCloudSaveStatus("云存档已导入，正在重启游戏…");
                  await restartGameAfterImport();
                } else {
                  setCloudSaveStatus("云存档已导入到本地，点击“开始游戏”即可载入。");
                }
              } catch (error) {
                setCloudSaveStatus(error.message || "云存档导入失败。", true);
              }
            });
            renameButton.addEventListener("click", () => renameCloudSave(save));
            deleteButton.addEventListener("click", () => deleteCloudSave(save));
            actions.append(importButton, renameButton, deleteButton);
          }
          card.append(title, details, actions);
          cloudSaveList.appendChild(card);
        }
      } catch (error) {
        setCloudSaveStatus(error.message || "无法读取云存档。", true);
      }
    }

    async function prepareResources() {
      if (resourcesInstalled) return;
      await downloadResources();
    }

    async function writeResourcesToFs() {
      if (resourcesInstalled) return;
      const entries = Array.from(resourceFiles.entries());
      const total = entries.reduce((sum, [, contents]) => sum + contents.byteLength, 0);
      let written = 0;
      setProgress(0, Math.max(total, 1));
      for (let index = 0; index < entries.length; index++) {
        const [path, contents] = entries[index];
        const fullPath = "/" + path;
        const directory = fullPath.slice(0, fullPath.lastIndexOf("/"));
        if (directory) Module.FS.mkdirTree(directory);
        Module.FS.writeFile(fullPath, contents);
        written += contents.byteLength;
        setProgress(written, Math.max(total, 1));
        gameLoadingStatus.textContent = "正在载入游戏资源… " +
          (index + 1) + " / " + entries.length;
        if ((index + 1) % 4 === 0) await new Promise((resolve) => setTimeout(resolve, 0));
      }
      resourcesInstalled = true;
    }

    function setupModuleGlobals() {
      window.moduleReadyPromise = new Promise((resolve, reject) => {
        window._resolveModuleReady = resolve;
        window._rejectModuleReady = reject;
      });
      window.Module = {
        canvas: canvasEl,
        noInitialRun: true,
        onRuntimeInitialized: () => window._resolveModuleReady(),
        onAbort: (message) => window._rejectModuleReady(new Error(message)),
        print: (message) => console.log(message),
        printErr: (message) => console.warn(message),
      };
      Module.canvas.addEventListener("contextmenu", (event) => event.preventDefault());
    }

    async function reloadWasmRuntime() {
      disposePreviousRuntime();
      listenerGeneration++;
      // 旧运行时的 WebGL 纹理/着色器状态仍留在同一个 canvas 上，
      // 复用会导致新游戏出现错乱的素材。换一个全新的 canvas 彻底隔离。
      const oldCanvas = canvasEl;
      if (oldCanvas && oldCanvas.parentNode) {
        const freshCanvas = document.createElement("canvas");
        freshCanvas.id = "canvas";
        freshCanvas.width = 800;
        freshCanvas.height = 600;
        freshCanvas.tabIndex = 0;
        oldCanvas.parentNode.replaceChild(freshCanvas, oldCanvas);
        canvasEl = freshCanvas;
        trackEventTarget(canvasEl);
      }
      try {
        const oldSDL2 = window.Module && window.Module.SDL2;
        if (oldSDL2 && oldSDL2.audio) {
          if (oldSDL2.audio.silenceTimer !== undefined) clearInterval(oldSDL2.audio.silenceTimer);
          if (oldSDL2.audio.scriptProcessorNode) {
            oldSDL2.audio.scriptProcessorNode.onaudioprocess = function () {};
            oldSDL2.audio.scriptProcessorNode.disconnect();
          }
        }
        if (oldSDL2 && oldSDL2.capture) {
          if (oldSDL2.capture.silenceTimer !== undefined) clearInterval(oldSDL2.capture.silenceTimer);
          if (oldSDL2.capture.scriptProcessorNode) {
            oldSDL2.capture.scriptProcessorNode.onaudioprocess = function () {};
            oldSDL2.capture.scriptProcessorNode.disconnect();
          }
        }
        if (oldSDL2 && oldSDL2.audioContext && typeof oldSDL2.audioContext.close === "function") {
          oldSDL2.audioContext.close();
        }
        if (window.Module && window.Module.ctx && typeof window.Module.ctx.close === "function") {
          window.Module.ctx.close();
        }
      } catch (error) {
        console.warn("关闭旧音频上下文失败：", error);
      }
      setupModuleGlobals();
      // 重新执行 Emscripten glue，而不是重新加载页面；资源文件仍留在内存中。
      // 包在函数作用域里可以避免与原脚本的顶层 class/var 重复声明冲突。
      const response = await fetch("pvz-portable.js", { cache: "force-cache" });
      if (!response.ok) throw new Error("重新加载游戏运行时失败。");
      const source = await response.text();
      new Function("Module", source + "\n//# sourceURL=pvz-portable.js")(window.Module);
      await window.moduleReadyPromise;
      saveFsReadyPromise = null;
      resourcesInstalled = false;
      needsRuntimeReload = false;
    }

    async function launchGame(statusText) {
      if (needsRuntimeReload) await reloadWasmRuntime();
      startScreen.style.display = "none";
      canvasContainer.style.display = "flex";
      applyCanvasScale();
      gameLoading.hidden = false;
      gameLoadingStatus.textContent = statusText || "正在加载游戏…";
      await window.moduleReadyPromise;
      await writeResourcesToFs();
      gameLoadingStatus.textContent = "正在读取本机存档…";
      await ensureSaveFsReady();
      await syncSaves();
      startSaveAutosync();
      gameLoading.hidden = true;
      Module.callMain([]);
      gameRunning = true;
    }

    async function startGame() {
      startButton.disabled = true;
      resourceUrl.disabled = true;
      loadingStatus.textContent = "";
      downloadProgress.hidden = true;
      try {
        await prepareResources();
        await launchGame("正在加载游戏…");
      } catch (error) {
        canvasContainer.style.display = "none";
        gameLoading.hidden = false;
        startScreen.style.display = "";
        loadingStatus.textContent = error.message || "游戏启动失败，请检查资源地址后重试。";
        startButton.disabled = false;
        resourceUrl.disabled = false;
        gameRunning = false;
      }
    }

    function fitScale() {
      const stage = ensureGameStage();
      return Math.min(
        Math.max(1, stage.clientWidth - 16) / NATIVE_CANVAS_WIDTH,
        Math.max(1, stage.clientHeight - 16) / NATIVE_CANVAS_HEIGHT
      );
    }

    trackRuntimeSideEffects();

    document.getElementById("zoom-out").addEventListener("click", () => {
      const current = viewMode === "fit" ? fitScale() : viewScale;
      setZoom(current - 0.1);
    });
    document.getElementById("zoom-in").addEventListener("click", () => {
      const current = viewMode === "fit" ? fitScale() : viewScale;
      setZoom(current + 0.1);
    });
    zoomFitButton.addEventListener("click", setFitMode);
    document.getElementById("zoom-fullscreen").addEventListener("click", togglePageFullscreen);
    document.getElementById("exit-game-button").addEventListener("click", handleGameExit);
    window.addEventListener("resize", applyCanvasScale);
    document.addEventListener("fullscreenchange", applyCanvasScale);
    window.onGameExit = handleGameExit;

    document.getElementById("start-cloud-save-button").addEventListener("click", openCloudSaveDialog);
    document.getElementById("game-cloud-save-button").addEventListener("click", openCloudSaveDialog);
    document.getElementById("game-editor-button").addEventListener("click", openEditorOverlay);
    document.getElementById("editor-close").addEventListener("click", closeEditorOverlay);
    editorOverlay.addEventListener("click", (event) => {
      if (event.target === editorOverlay) closeEditorOverlay();
    });
    document.getElementById("cloud-save-refresh").addEventListener("click", refreshCloudSaveList);
    document.getElementById("cloud-save-close").addEventListener("click", () => {
      cloudSaveOverlay.hidden = true;
    });
    cloudSaveOverlay.addEventListener("click", (event) => {
      if (event.target === cloudSaveOverlay) cloudSaveOverlay.hidden = true;
    });
    document.getElementById("app-modal-cancel").addEventListener("click", () => finishAppModal(false));
    document.getElementById("app-modal-confirm").addEventListener("click", () => finishAppModal(true));
    appModalInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") finishAppModal(true);
    });
    appModalOverlay.addEventListener("click", (event) => {
      if (event.target === appModalOverlay) finishAppModal(false);
    });
    document.addEventListener("keydown", (event) => {
      if (event.key !== "Escape") return;
      if (!appModalOverlay.hidden) finishAppModal(false);
      else if (!cloudSaveOverlay.hidden) cloudSaveOverlay.hidden = true;
      else if (!editorOverlay.hidden) closeEditorOverlay();
    });
    startButton.addEventListener("click", startGame);
    resourceUrl.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !startButton.disabled) startGame();
    });
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") syncSavesBeforeLeaving();
    });
    window.addEventListener("pagehide", syncSavesBeforeLeaving);
    listenerGeneration = 1;
  </script>
</body>
</html>
